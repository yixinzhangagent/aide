<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>aide · 本地 AI 助理</title>
  <style>
    :root { --bg:#f7f7f8; --panel:#ffffff; --border:#e5e5e7; --accent:#2563eb; --muted:#6b7280; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:var(--bg); color:#111827; }
    header { padding:14px 20px; border-bottom:1px solid var(--border); background:var(--panel); font-weight:600; }
    header span { color:var(--muted); font-weight:400; font-size:13px; margin-left:8px; }
    #chat { max-width:820px; margin:0 auto; padding:20px; height:calc(100vh - 120px); overflow-y:auto; }
    .msg { margin:12px 0; padding:12px 16px; border-radius:10px; white-space:pre-wrap; line-height:1.6; }
    .user { background:var(--accent); color:#fff; margin-left:60px; }
    .bot { background:var(--panel); border:1px solid var(--border); margin-right:60px; }
    .err { color:#b91c1c; }
    #bar { max-width:820px; margin:0 auto; padding:12px 20px; display:flex; gap:10px; }
    #input { flex:1; padding:12px 14px; border:1px solid var(--border); border-radius:10px; font-size:15px; }
    button { padding:0 20px; border:none; border-radius:10px; background:var(--accent); color:#fff; font-size:15px; cursor:pointer; }
    button:disabled { opacity:.5; cursor:default; }
  </style>
</head>
<body>
  <header>aide<span>本地 AI 助理 · 仅运行在你的电脑上</span></header>
  <div id="chat">
    <div class="msg bot">你好，我是 aide。有什么可以帮你？</div>
  </div>
  <div id="bar">
    <input id="input" placeholder="输入消息，回车发送…" autocomplete="off" />
    <button id="send">发送</button>
  </div>
  <script>
    const chat = document.getElementById('chat');
    const input = document.getElementById('input');
    const send = document.getElementById('send');
    const history = [];

    function add(text, cls) {
      const div = document.createElement('div');
      div.className = 'msg ' + cls;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    async function submit() {
      const text = input.value.trim();
      if (!text) return;
      add(text, 'user');
      history.push({ role: 'user', content: text });
      input.value = '';
      send.disabled = true;
      const pending = add('思考中…', 'bot');
      try {
        const res = await fetch('/v1/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages: history })
        });
        if (!res.ok) throw new Error('服务返回 ' + res.status);
        const data = await res.json();
        const reply = data.choices[0].message.content;
        pending.textContent = reply;
        history.push({ role: 'assistant', content: reply });
      } catch (e) {
        pending.className = 'msg bot err';
        pending.textContent = '请求失败：' + e.message;
      } finally {
        send.disabled = false;
        input.focus();
      }
    }

    send.addEventListener('click', submit);
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });
    input.focus();
  </script>
</body>
</html>
